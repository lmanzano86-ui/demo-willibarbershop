<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar cita</title>
<style>
:root{ --bg:#0d0d0f; --card:#16161a; --accent:#d8b45a; --accent2:#d17f0e; --text:#f2efe8; --muted:#a9a49a; }
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}
.wrap{max-width:520px; margin:0 auto; padding:20px 16px 60px;}
header{text-align:center; padding:18px 0 6px;}
header h1{font-size:24px; letter-spacing:.5px;}
header p{color:var(--muted); font-size:14px; margin-top:4px;}
.lang{position:absolute; top:14px; right:14px;}
.lang button{background:transparent; border:1px solid var(--accent); color:var(--accent); border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer;}
.steps{display:flex; gap:6px; justify-content:center; margin:14px 0 20px;}
.steps span{height:4px; width:44px; border-radius:2px; background:#333;}
.steps span.on{background:var(--accent);}
h2.st{font-size:18px; margin:6px 0 14px; text-align:center;}
.grid{display:grid; gap:10px;}
.card{background:var(--card); border:1px solid #2a2a30; border-radius:14px; padding:16px; cursor:pointer; transition:.15s; display:flex; justify-content:space-between; align-items:center;}
.card:hover{border-color:var(--accent);}
.card.sel{border-color:var(--accent); background:#1e1a10;}
.card .nm{font-weight:600;}
.card .sub{color:var(--muted); font-size:13px; margin-top:3px;}
.card .pr{color:var(--accent); font-weight:700; white-space:nowrap; margin-left:10px;}
.dates{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px;}
.date{min-width:64px; text-align:center; background:var(--card); border:1px solid #2a2a30; border-radius:12px; padding:10px 6px; cursor:pointer; flex-shrink:0;}
.date.sel{border-color:var(--accent); background:#1e1a10;}
.date .dw{font-size:11px; color:var(--muted); text-transform:uppercase;}
.date .dn{font-size:18px; font-weight:700;}
.times{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.time{background:var(--card); border:1px solid #2a2a30; border-radius:10px; padding:11px 4px; text-align:center; cursor:pointer; font-size:14px;}
.time.sel{border-color:var(--accent); background:#1e1a10; color:var(--accent); font-weight:700;}
.time:disabled{opacity:.3; cursor:default;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px;}
.field input{width:100%; background:var(--card); border:1px solid #2a2a30; color:var(--text); border-radius:10px; padding:13px; font-size:16px;}
.field input:focus{outline:none; border-color:var(--accent);}
.btn{display:block; width:100%; background:var(--accent); color:#141414; border:none; border-radius:12px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; margin-top:16px;}
.btn:disabled{opacity:.5;}
.btn.ghost{background:transparent; color:var(--muted); border:1px solid #333; margin-top:10px;}
.summary{background:var(--card); border-radius:14px; padding:18px; margin-bottom:6px;}
.summary div{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #26262b; font-size:15px;}
.summary div:last-child{border:none;}
.summary .k{color:var(--muted);}
.summary .v{font-weight:600; text-align:right;}
.total{font-size:18px !important;}
.total .v{color:var(--accent);}
.ok{text-align:center; padding:20px 0;}
.ok .big{font-size:52px;}
.ok h2{margin:10px 0;}
.ok p{color:var(--muted); margin-bottom:6px;}
.wa{display:inline-block; margin-top:14px; background:#25d366; color:#062b16; font-weight:700; padding:13px 26px; border-radius:30px; text-decoration:none;}
.err{background:#3a1414; border:1px solid #a33; color:#ffb3b3; border-radius:10px; padding:12px; margin-bottom:12px; font-size:14px; display:none;}
#card-el{background:var(--card); border:1px solid #2a2a30; border-radius:10px; padding:13px; margin:10px 0;}
.spin{text-align:center; padding:30px; color:var(--muted);}
</style>
</head>
<body>
<div class="lang"><button id="langBtn">EN</button></div>
<div class="wrap">
  <header><h1 id="bName">…</h1><p id="bTag">…</p><p style="display:inline-block;background:#d8b45a;color:#141414;font-size:11px;font-weight:700;border-radius:6px;padding:3px 10px;margin-top:6px;">VERSIÓN DE PRUEBA</p></header>
  <div class="steps" id="steps"></div>
  <div id="app"><div class="spin">Cargando…</div></div>
</div>
<script>
const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
let CFG=null, LANG='es';
const S={step:1,service:null,staff:null,date:null,slot:null,customer:{},payMethod:null,booking:null,pay:null};

const T={
es:{s1:'Elige tu servicio',s2:'Elige tu barbero',s3:'Elige fecha y hora',s4:'Tus datos',s5:'Pago',s6:'¡Listo!',
min:'min',back:'← Atrás',next:'Continuar',name:'Nombre completo',phone:'Teléfono / WhatsApp',email:'Correo (opcional)',
payCard:'Tarjeta en línea',payShop:'Pagar en el local',pay:'Pagar',confirm:'Confirmar reserva',
total:'Total',deposit:'Anticipo a pagar hoy',rest:'Resto en el local',ok:'¡Cita confirmada!',
okSub:'Te esperamos. Llega 5 minutos antes.',my:'Mis datos',svc:'Servicio',barber:'Barbero',when:'Fecha y hora',
err:'Ocurrió un error, intenta de nuevo.',noslots:'No hay horarios ese día, prueba otra fecha.',loading:'Cargando…',
cardDemo:'Tarjeta demo — cualquier dato funciona',payAtShop:'Pagarás en el local el día de tu cita.'},
en:{s1:'Choose your service',s2:'Choose your barber',s3:'Pick date & time',s4:'Your details',s5:'Payment',s6:'Done!',
min:'min',back:'← Back',next:'Continue',name:'Full name',phone:'Phone / WhatsApp',email:'Email (optional)',
payCard:'Card online',payShop:'Pay at the shop',pay:'Pay',confirm:'Confirm booking',
total:'Total',deposit:'Deposit due today',rest:'Rest at the shop',ok:'Appointment confirmed!',
okSub:'See you soon. Please arrive 5 minutes early.',my:'Details',svc:'Service',barber:'Barber',when:'Date & time',
err:'Something went wrong, try again.',noslots:'No times that day, try another date.',loading:'Loading…',
cardDemo:'Demo card — any details work',payAtShop:'You will pay at the shop on the day.'}};
const t=k=>T[LANG][k];
const svcName=s=>LANG==='es'?s.nombre:(s.nombre_en||s.nombre);
const staffName=s=>LANG==='es'?s.name:(s.name_en||s.name);

const WILLI_CFG = {"address": "Tampa, FL", "advanceDays": 14, "currency": "USD", "deposit": {"type": "none"}, "hours": {"fri": [["09:00", "19:30"]], "mon": [["09:00", "19:30"]], "sat": [["09:00", "19:30"]], "sun": [["10:00", "19:00"]], "thu": [["09:00", "19:30"]], "tue": [["09:00", "19:30"]], "wed": [["09:00", "19:30"]]}, "locale": "es", "name": "Willi Barbershop", "payments": [{"id": "mock", "label": "Tarjeta (demo)"}, {"id": "manual", "label": "Pagar en el local"}], "phone": "+17868616791", "phoneDisplay": "+1 (786) 861-6791", "services": [{"id": "corte-barba", "nombre": "Corte + Barba", "nombre_en": "Cut + Beard", "precio": 40, "duracion_min": 45}, {"id": "fade", "nombre": "Fade", "nombre_en": "Fade", "precio": 30, "duracion_min": 30}, {"id": "fade-trim", "nombre": "Fade + trim arriba", "nombre_en": "Fade + trim on top", "precio": 35, "duracion_min": 40}, {"id": "nino", "nombre": "Corte de niño", "nombre_en": "Kids cut", "precio": 30, "duracion_min": 30}, {"id": "prime", "nombre": "Prime Service", "nombre_en": "Prime Service", "precio": 70, "duracion_min": 90}, {"id": "barba", "nombre": "Arreglo de barba", "nombre_en": "Beard trim", "precio": 20, "duracion_min": 20}, {"id": "lineup", "nombre": "Line up", "nombre_en": "Line up", "precio": 15, "duracion_min": 15}, {"id": "afeitado", "nombre": "Afeitado", "nombre_en": "Shave", "precio": 10, "duracion_min": 20}], "slotIntervalMin": 15, "slug": "willi-barber-shop", "staff": [{"id": "any", "name": "Primer barbero disponible", "name_en": "First available barber", "role": "any"}, {"id": "barbero-1", "name": "Barbero 1", "name_en": "Barber 1", "role": "barber"}, {"id": "barbero-2", "name": "Barbero 2", "name_en": "Barber 2", "role": "barber"}], "tagline": "Tampa, FL · Abierto los 7 días", "theme": {"accent": "#d8b45a", "accent2": "#d17f0e", "bg": "#0d0d0f", "card": "#16161a", "text": "#f2efe8"}, "timezone": "America/New_York", "whatsapp": "https://wa.me/17868616791"};
async function init(){
  CFG=WILLI_CFG;
  document.title=(LANG==='es'?'Reservar — ':'Book — ')+CFG.name;
  document.getElementById('bName').textContent=CFG.name;
  document.getElementById('bTag').textContent=CFG.tagline||'';
  const th=CFG.theme||{};
  const root=document.documentElement.style;
  if(th.bg)root.setProperty('--bg',th.bg); if(th.card)root.setProperty('--card',th.card);
  if(th.accent)root.setProperty('--accent',th.accent); if(th.accent2)root.setProperty('--accent2',th.accent2);
  if(th.text)root.setProperty('--text',th.text);
  document.getElementById('langBtn').onclick=()=>{LANG=LANG==='es'?'en':'es';
    document.getElementById('langBtn').textContent=LANG==='es'?'EN':'ES'; render();};
  const pre=new URLSearchParams(location.search).get('servicio');
  if(pre){const s=CFG.services.find(x=>x.id===pre); if(s){S.service=s; S.step=2;}}
  render();
}
function steps(n){document.getElementById('steps').innerHTML=Array.from({length:6},(_,i)=>`<span class="${i<n?'on':''}"></span>`).join('');}
function err(m){const e=document.getElementById('errBox'); if(e){e.style.display='block'; e.textContent=m||t('err'); window.scrollTo(0,0);}}
function render(){steps(S.step); const fns=[null,rS1,rS2,rS3,rS4,rS5,rS6]; fns[S.step]();}
function back(n){S.step=n; render(); window.scrollTo(0,0);}

function rS1(){
  document.getElementById('app').innerHTML=`<div id="errBox" class="err"></div><h2 class="st">${t('s1')}</h2><div class="grid">`+
  CFG.services.map(s=>`<div class="card" onclick="pickService('${s.id}')"><div><div class="nm">${svcName(s)}</div><div class="sub">${s.duracion_min} ${t('min')}</div></div><div class="pr">$${s.precio}</div></div>`).join('')+`</div>`;
}
function pickService(id){S.service=CFG.services.find(s=>s.id===id); S.step=2; render(); window.scrollTo(0,0);}

function rS2(){
  document.getElementById('app').innerHTML=`<div id="errBox" class="err"></div><h2 class="st">${t('s2')}</h2><div class="grid">`+
  CFG.staff.map(s=>`<div class="card" onclick="pickStaff('${s.id}')"><div><div class="nm">${staffName(s)}</div>${s.role&&s.role!=='any'?`<div class="sub">Barber</div>`:''}</div><div class="pr">→</div></div>`).join('')+
  `</div><button class="btn ghost" onclick="back(1)">${t('back')}</button>`;
}
function pickStaff(id){S.staff=CFG.staff.find(s=>s.id===id); S.step=3; render(); window.scrollTo(0,0);}

function dayList(){
  const days=[]; const now=new Date();
  for(let i=0;i<(CFG.advanceDays||14);i++){
    const d=new Date(now.getTime()+i*86400000);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}
function rS3(){
  const days=dayList();
  if(!S.date)S.date=days[0];
  const app=document.getElementById('app');
  app.innerHTML=`<div id="errBox" class="err"></div><h2 class="st">${t('s3')}</h2>
  <div class="dates">${days.map(d=>{const dt=new Date(d+'T12:00:00');
    const loc=LANG==='es'?'es-US':'en-US';
    const dw=new Intl.DateTimeFormat(loc,{weekday:'short'}).format(dt), dn=dt.getDate();
    return `<div class="date ${S.date===d?'sel':''}" onclick="pickDate('${d}')"><div class="dw">${dw}</div><div class="dn">${dn}</div></div>`;}).join('')}</div>
  <div class="times" id="times"><div class="spin">${t('loading')}</div></div>
  <button class="btn ghost" onclick="back(2)">${t('back')}</button>`;
  loadSlots();
}
function pickDate(d){S.date=d; S.slot=null; rS3();}
async function loadSlots(){
  const box=document.getElementById('times');
  try{
    const slots=localSlots();
    if(!slots.length){box.innerHTML=`<div class="spin">${t('noslots')}</div>`;return;}
    box.innerHTML=slots.map((s,i)=>{
      const dt=new Date(s.startMs);
      const hr=new Intl.DateTimeFormat(LANG==='es'?'es-US':'en-US',{hour:'numeric',minute:'2-digit',hour12:true}).format(dt);
      return `<button class="time" data-i="${i}" onclick="pickSlot(${i})">${hr}</button>`;}).join('');
    box._slots=slots;
  }catch(e){box.innerHTML=`<div class="spin">${t('err')}</div>`;}
}
function localSlots(){
  const parts=S.date.split('-').map(Number);
  const dow=['sun','mon','tue','wed','thu','fri','sat'][new Date(Date.UTC(parts[0],parts[1]-1,parts[2])).getUTCDay()];
  const hours=CFG.hours[dow]||[];
  const staffIds=S.staff.id==='any'?CFG.staff.filter(s=>s.id!=='any').map(s=>s.id):[S.staff.id];
  const out=[]; const now=Date.now();
  for(const oc of hours){
    const o=oc[0].split(':').map(Number), c=oc[1].split(':').map(Number);
    let tmin=o[0]*60+o[1]; const endMin=c[0]*60+c[1];
    while(tmin+S.service.duracion_min<=endMin){
      const dt=new Date(parts[0],parts[1]-1,parts[2],Math.floor(tmin/60),tmin%60);
      if(dt.getTime()>now+15*60000)out.push({startMs:dt.getTime(),staffIds:staffIds});
      tmin+=CFG.slotIntervalMin;
    }
  }
  return out;
}
function pickSlot(i){
  const s=document.getElementById('times')._slots[i];
  S.slot=s;
  document.querySelectorAll('.time').forEach(b=>b.classList.remove('sel'));
  document.querySelector(`.time[data-i="${i}"]`).classList.add('sel');
  setTimeout(()=>{S.step=4; render(); window.scrollTo(0,0);},250);
}

function rS4(){
  document.getElementById('app').innerHTML=`<div id="errBox" class="err"></div><h2 class="st">${t('s4')}</h2>
  <div class="field"><label>${t('name')}</label><input id="fName" value="${S.customer.name||''}" autocomplete="name"></div>
  <div class="field"><label>${t('phone')}</label><input id="fPhone" inputmode="tel" value="${S.customer.phone||''}" autocomplete="tel"></div>
  <div class="field"><label>${t('email')}</label><input id="fEmail" inputmode="email" value="${S.customer.email||''}" autocomplete="email"></div>
  <button class="btn" onclick="goPay()">${t('next')}</button>
  <button class="btn ghost" onclick="back(3)">${t('back')}</button>`;
}
function goPay(){
  const name=document.getElementById('fName').value.trim(), phone=document.getElementById('fPhone').value.trim();
  if(!name||!phone){err(t('err'));return;}
  S.customer={name,phone,email:document.getElementById('fEmail').value.trim()};
  S.step=5; render(); window.scrollTo(0,0);
}

function amountDue(){
  const d=CFG.deposit||{type:'none'};
  if(d.type==='percent')return +(S.service.precio*d.value/100).toFixed(2);
  if(d.type==='fixed')return +d.value;
  return +S.service.precio;
}
function rS5(){
  const due=amountDue(), methods=CFG.payments;
  const dt=new Date(S.slot.startMs);
  const when=new Intl.DateTimeFormat(LANG==='es'?'es-US':'en-US',{weekday:'long',day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true,timeZone:CFG.timezone}).format(dt);
  document.getElementById('app').innerHTML=`<div id="errBox" class="err"></div><h2 class="st">${t('s5')}</h2>
  <div class="summary">
    <div><span class="k">${t('svc')}</span><span class="v">${svcName(S.service)}</span></div>
    <div><span class="k">${t('barber')}</span><span class="v">${staffName(S.staff.id==='any'?{name:'—'}:S.staff)}</span></div>
    <div><span class="k">${t('when')}</span><span class="v">${when}</span></div>
    <div class="total"><span class="k">${CFG.deposit&&CFG.deposit.type!=='none'?t('deposit'):t('total')}</span><span class="v">$${due}</span></div>
    ${CFG.deposit&&CFG.deposit.type!=='none'?`<div><span class="k">${t('rest')}</span><span class="v">$${(S.service.precio-due).toFixed(2)}</span></div>`:''}
  </div>
  <div class="grid" style="margin-top:12px">${methods.map(m=>`<div class="card" id="pm-${m.id}" onclick="pickPay('${m.id}')"><div class="nm">${m.id==='manual'?t('payShop'):t('payCard')+' · '+m.label.replace(/^Tarjeta \(|\)$/g,'')}</div><div class="pr">→</div></div>`).join('')}</div>
  <div id="payArea"></div>
  <button class="btn ghost" onclick="back(4)">${t('back')}</button>`;
}
async function pickPay(id){
  S.payMethod=id;
  document.querySelectorAll('.grid .card').forEach(c=>c.classList.remove('sel'));
  const el=document.getElementById('pm-'+id); if(el)el.classList.add('sel');
  const area=document.getElementById('payArea');
  const sid=S.staff.id==='any'?S.slot.staffIds[0]:S.staff.id;
  const st=CFG.staff.find(s=>s.id===sid);
  S.booking={id:Math.random().toString(36).slice(2,8).toUpperCase(),serviceName:svcName(S.service),
    servicePrice:S.service.precio,staffName:staffName(st),startMs:S.slot.startMs,
    customer:S.customer,payment:{method:id},status:id==='manual'?'confirmed':'pending_payment'};
  if(id==='manual'){S.step=6;render();window.scrollTo(0,0);return;}
  mockForm(area);
}
async function doBook(){
  try{
    const r=await fetch(`/api/businesses/${slug}/bookings`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({serviceId:S.service.id,staffId:S.staff.id,startMs:S.slot.startMs,customer:S.customer,paymentMethod:'manual'})});
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    S.booking=j.booking; S.step=6; render(); window.scrollTo(0,0);
  }catch(e){err(e.message);}
}
// ---- Stripe ----
let stripeObj=null, cardEl=null;
async function stripeForm(area){
  area.innerHTML=`<div id="card-el"></div><button class="btn" id="payBtn">${t('pay')} $${amountDue()}</button>`;
  if(!window.Stripe){await loadScript('https://js.stripe.com/v3/');}
  stripeObj=Stripe(S.pay.publishableKey);
  const els=stripeObj.elements();
  cardEl=els.create('card',{style:{base:{color:'#f2efe8',fontSize:'16px','::placeholder':{color:'#a9a49a'}}}});
  cardEl.mount('#card-el');
  document.getElementById('payBtn').onclick=async()=>{
    const btn=document.getElementById('payBtn'); btn.disabled=true; btn.textContent=t('loading');
    const {error}=await stripeObj.confirmCardPayment(S.pay.clientSecret,{payment_method:{card:cardEl}});
    if(error){err(error.message); btn.disabled=false; btn.textContent=t('pay')+' $'+amountDue(); return;}
    await confirmAndGo('stripe',{});
  };
}
// ---- Square ----
async function squareForm(area){
  area.innerHTML=`<div id="card-el"></div><button class="btn" id="payBtn">${t('pay')} $${amountDue()}</button>`;
  if(!window.Square){await loadScript(S.pay.env==='sandbox'?'https://sandbox.web.squarecdn.com/v1/square.js':'https://web.squarecdn.com/v1/square.js');}
  try{
    const sq=window.Square.payments(S.pay.appId,S.pay.locationId);
    const card=await sq.card(); await card.attach('#card-el');
    document.getElementById('payBtn').onclick=async()=>{
      const btn=document.getElementById('payBtn'); btn.disabled=true;
      const {token,errors}=await card.tokenize();
      if(errors){err(errors[0].message); btn.disabled=false; return;}
      await confirmAndGo('square',{sourceId:token});
    };
  }catch(e){err(e.message);}
}
// ---- Mock (demo) ----
function mockForm(area){
  area.innerHTML=`<p style="color:var(--muted);font-size:13px;margin:10px 0;">${t('cardDemo')}</p>
  <div class="field"><input id="mCard" inputmode="numeric" placeholder="4242 4242 4242 4242"></div>
  <button class="btn" onclick="confirmAndGo('mock',{})">${t('pay')} $${amountDue()}</button>`;
}
async function confirmAndGo(method,extra){
  S.booking.status='confirmed'; S.booking.payment={method:method,status:'paid_demo'};
  S.step=6; render(); window.scrollTo(0,0);
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

function rS6(){
  const b=S.booking, dt=new Date(b.startMs);
  const when=new Intl.DateTimeFormat(LANG==='es'?'es-US':'en-US',{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit',hour12:true,timeZone:CFG.timezone}).format(dt);
  const wa=`https://wa.me/${CFG.phone.replace(/\D/g,'')}?text=${encodeURIComponent((LANG==='es'?'Hola ':'Hi ')+CFG.name+', '+(LANG==='es'?'confirmo mi cita':'confirming my booking')+' '+b.id)}`;
  document.getElementById('app').innerHTML=`<div class="ok"><div class="big">✅</div><h2>${t('ok')}</h2>
  <p>${t('okSub')}</p></div>
  <div class="summary">
    <div><span class="k">${t('svc')}</span><span class="v">${b.serviceName}</span></div>
    <div><span class="k">${t('barber')}</span><span class="v">${b.staffName}</span></div>
    <div><span class="k">${t('when')}</span><span class="v">${when}</span></div>
    <div><span class="k">${t('my')}</span><span class="v">${b.customer.name}</span></div>
    <div><span class="k">ID</span><span class="v">${b.id}</span></div>
  </div>
  <a class="wa" href="${wa}" target="_blank">WhatsApp</a>`;
}
init();
</script>
</body>
</html>
